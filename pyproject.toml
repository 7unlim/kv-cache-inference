[build-system]
requires = ["setuptools>=68", "pybind11>=2.12"]
build-backend = "setuptools.build_meta"

[project]
name = "kv-cache-inference"
version = "0.1.0"
description = "Paged KV-cache inference with a C++ allocator and split-K CUDA decoding"
requires-python = ">=3.10"
dependencies = ["torch>=2.5", "safetensors>=0.4"]

[project.optional-dependencies]
cuda = ["ninja>=1.11"]
model = ["transformers>=4.46,<5", "huggingface-hub>=0.26"]
test = ["pytest>=8"]

[project.scripts]
paged-generate = "kv_cache.generate:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
